# ==============================================================================
# CẤU HÌNH PROMETHEUS - ĐỀ 19: WEBSITE TIN TỨC / CỔNG THÔNG TIN (VIETNEWS 24H)
# Thu thập Metrics từ: Prometheus, Nginx Reverse Proxy, MySQL 8.0 & Docker Containers
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "vietnews-portal-de19"
    environment: "production-demo"

scrape_configs:
  # 1. Giám sát bản thân dịch vụ Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: "monitoring-core"

  # 2. Giám sát Web Server / Reverse Proxy Nginx qua nginx-prometheus-exporter
  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          component: "web-reverse-proxy"
          service: "nginx"

  # 3. Giám sát Cơ sở dữ liệu MySQL 8.0 qua mysqld-exporter
  - job_name: "mysql-exporter"
    static_configs:
      - targets: ["mysql-exporter:9104"]
        labels:
          component: "database"
          service: "mysql"

  # 4. Giám sát Tài nguyên toàn bộ Docker Containers (CPU, RAM, Network, Disk) qua cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: "container-runtime"
