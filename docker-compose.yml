# ==============================================================================
# DOCKER COMPOSE HOÀN CHỈNH - ĐỀ 19: WEBSITE TIN TỨC / CỔNG THÔNG TIN (VIETNEWS 24H)
# Giai đoạn 3 (Commit 3): Tích hợp Loki + Promtail (LogQL) & Hardening Toàn Diện
# ==============================================================================

name: vietnews-de19

services:
  # ----------------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU: MySQL 8.0 (Bền vững qua Volume + Cấu hình Hardening)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: vietnews-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d/hardening.cnf:/etc/mysql/conf.d/hardening.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Hardening: Không mở cổng 3306 ra máy host, chỉ giao tiếp trong backend_net
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 2. CÔNG CỤ QUẢN TRỊ DB: phpMyAdmin (Chỉ bind Loopback 127.0.0.1)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: vietnews-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. ỨNG DỤNG WEB TIN TỨC: WordPress Official Image (Không mở cổng trực tiếp)
  # ----------------------------------------------------------------------------
  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: vietnews-wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-vn24_}
      WORDPRESS_CONFIG_EXTRA: |
        if (!isset($$_SERVER['HTTP_HOST'])) {
            $$_SERVER['HTTP_HOST'] = 'localhost';
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
            $$_SERVER['HTTP_HOST'] = $$_SERVER['HTTP_X_FORWARDED_HOST'];
        }
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('FORCE_SSL_ADMIN', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes/vietnews-portal:/var/www/html/wp-content/themes/vietnews-portal
    networks:
      - frontend_net
      - backend_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 150
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/wp-login.php >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 4. TÁC VỤ KHỞI TẠO TỰ ĐỘNG: WP-CLI (Chạy Non-root UID 33:33 www-data)
  # ----------------------------------------------------------------------------
  wp-setup:
    image: wordpress:cli-2.11-php8.2
    container_name: vietnews-wp-setup
    user: "33:33"
    depends_on:
      mysql:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-vn24_}
      WP_SITE_URL: ${WP_SITE_URL}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_EDITOR_USER: ${WP_EDITOR_USER}
      WP_EDITOR_PASSWORD: ${WP_EDITOR_PASSWORD}
      WP_EDITOR_EMAIL: ${WP_EDITOR_EMAIL}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes/vietnews-portal:/var/www/html/wp-content/themes/vietnews-portal
      - ./wordpress/setup:/setup:ro
    entrypoint: ["sh", "-c", "tr -d '\\r' < /setup/init-wordpress.sh | sh"]
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # ----------------------------------------------------------------------------
  # 5. REVERSE PROXY: Nginx (HTTPS tự ký + Security Headers + Rate Limiting)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: vietnews-nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 6. NGINX EXPORTER: Thu thập Metrics từ Nginx (Chạy Non-root 65534:65534)
  # ----------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: vietnews-nginx-exporter
    user: "65534:65534"
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    command:
      - "--nginx.scrape-uri=http://nginx:8080/nginx_status"
    networks:
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    pids_limit: 50

  # ----------------------------------------------------------------------------
  # 7. MYSQL EXPORTER: Thu thập Metrics từ MySQL (Chạy Non-root 65534:65534)
  # ----------------------------------------------------------------------------
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: vietnews-mysql-exporter
    user: "65534:65534"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - "--config.my-cnf=/cfg/exporter.cnf"
      - "--collect.global_status"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.info_schema.processlist"
    volumes:
      - ./mysql/exporter.cnf:/cfg/exporter.cnf:ro
    networks:
      - backend_net
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    pids_limit: 50

  # ----------------------------------------------------------------------------
  # 8. CADVISOR: Giám sát Tài nguyên Container (CPU, RAM, Network, Disk)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: vietnews-cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8082}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100

  # ----------------------------------------------------------------------------
  # 9. PROMETHEUS: Hệ thống Giám sát Tập trung (Chạy Non-root 65534:65534)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: vietnews-prometheus
    user: "65534:65534"
    restart: unless-stopped
    depends_on:
      - nginx-exporter
      - mysql-exporter
      - cadvisor
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 100

  # ----------------------------------------------------------------------------
  # 10. GRAFANA: Bảng điều khiển Giám sát & Truy vấn Log (Chạy Non-root 472:472)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: vietnews-grafana
    user: "472:472"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DEFAULT_THEME: "dark"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100

  # ----------------------------------------------------------------------------
  # 11. LOKI: Hệ thống Lưu trữ & Truy vấn Log Tập trung (Chạy Non-root 10001:10001)
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: vietnews-loki
    user: "10001:10001"
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100

  # ----------------------------------------------------------------------------
  # 12. PROMTAIL: Agent Thu thập Log từ Docker Socket & Nginx Logs
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.8
    container_name: vietnews-promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100

# ==============================================================================
# CÔ LẬP MẠNG NỘI BỘ (NETWORK ISOLATION - HARDENING)
# - frontend_net: Chỉ nối giữa Nginx Reverse Proxy và WordPress
# - backend_net:  Chỉ nối giữa WordPress, phpMyAdmin, MySQL và MySQL Exporter
# - monitoring_net: Chỉ dành cho các dịch vụ Giám sát (Prometheus, Grafana, Loki, Promtail, Exporters)
# ==============================================================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

# ==============================================================================
# LƯU TRỮ DỮ LIỆU BỀN VỮNG (PERSISTENT VOLUMES)
# ==============================================================================
volumes:
  mysql_data:
  wordpress_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:
