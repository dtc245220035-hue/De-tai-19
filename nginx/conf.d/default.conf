# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY - ĐỀ 19: WEBSITE TIN TỨC / CỔNG THÔNG TIN
# Bao gồm: HTTP -> HTTPS Redirect, Self-Signed TLS, Security Headers,
#          Rate Limiting, File Access Control & Stub Status cho Prometheus
# ==============================================================================

upstream wordpress_upstream {
    server wordpress:80;
    keepalive 32;
}

# 1. Server HTTP (Port 80): Chuyển hướng toàn bộ sang HTTPS (Port 443)
server {
    listen 80;
    server_name localhost vietnews24h.local _;

    # Security Headers ngay cả trên phản hồi Redirect
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint kiểm tra sức khỏe nhanh
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "VietNews 24h Nginx Reverse Proxy: OK\n";
    }

    # Chuyển hướng 301 sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS (Port 443): Reverse Proxy chính cho Website Tin tức WordPress
server {
    listen 443 ssl;
    http2 on;
    server_name localhost vietnews24h.local _;

    # Chứng chỉ SSL tự ký (Self-Signed Certificate)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Hardening SSL/TLS: Chỉ cho phép TLS 1.2 và TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- CÁC SECURITY HEADERS BẢO VỆ WEBSITE (HARDENING) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: http: data: blob:; font-src 'self' https: data:;" always;
    add_header X-Proxy-By "VietNews24h-SecProxy" always;

    # Endpoint kiểm tra sức khỏe qua HTTPS
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "VietNews 24h HTTPS Reverse Proxy: OK\n";
    }

    # Hardening 1: Chặn truy cập các file ẩn (.git, .env, .htaccess...)
    location ~ /\. {
        deny all;
        return 403;
    }

    # Hardening 2: Chặn truy cập xmlrpc.php (ngăn chặn tấn công DDoS Pingback & Brute-force)
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # Hardening 3: Chặn truy cập trực tiếp file cấu hình và tài liệu tiết lộ phiên bản
    location ~* ^/(wp-config\.php|readme\.html|license\.txt)$ {
        deny all;
        return 403;
    }

    # Hardening 4: Chặn thực thi script PHP trong thư mục uploads
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
        return 403;
    }

    # Hardening 5: Giới hạn tần suất (Rate Limiting) trang đăng nhập quản trị
    location = /wp-login.php {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://wordpress_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Reverse Proxy chính tới WordPress container
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://wordpress_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }
}

# 3. Server Nội Bộ (Port 8080): Cung cấp stub_status cho Prometheus Nginx Exporter
# Cổng này KHÔNG được publish ra máy host, chỉ truy cập được trong mạng nội bộ Docker
server {
    listen 8080;
    server_name localhost;

    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
